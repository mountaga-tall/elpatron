<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="EL PATRÓN — Restaurant · Bar · Café · Abidjan.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="images/logo.webp">
  <title>EL PATRÓN · Choisir la langue</title>
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <section style="width:min(100%,620px);text-align:center;padding:42px 28px;border:1px solid rgba(27,23,21,.11);border-radius:28px;background:rgba(255,255,255,.92);box-shadow:0 24px 70px rgba(32,25,22,.10)">
      <img src="images/logo.webp" alt="EL PATRÓN" width="120" height="120" style="margin:0 auto 22px">
      <div style="font:600 2.6rem/1 'Cormorant Garamond',serif;color:#171313">EL PATRÓN</div>
      <p style="margin:12px auto 28px;color:#6d6662">Choisissez votre langue / Choose your language / اختر لغتك</p>
      <nav style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px" aria-label="Choix de la langue">
        <a class="btn btn-primary" href="fr/">Français</a>
        <a class="btn btn-glass" href="en/">English</a>
        <a class="btn btn-glass" href="ar/" dir="rtl">العربية</a>
      </nav>
    </section>
  </main>
</body>
</html>
