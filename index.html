    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --gold: #d4af37;
            --gold-hover: #f1c94f;
            --text-light: #f5f5f5;
            --text-muted: #a0a0a0;
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 4rem 2rem 2rem;
            background: linear-gradient(to bottom, #000000, transparent);
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* NAVIGATION TABS */
        .nav-container {
            position: sticky;
            top: 0;
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .category-nav {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 0 2rem;
            gap: 1.5rem;
        }

        .category-nav::-webkit-scrollbar {
            height: 4px;
        }
        .category-nav::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 0.5rem 0;
            white-space: nowrap;
            transition: var(--transition);
            position: relative;
        }

        .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--gold);
            transition: var(--transition);
        }

        .nav-btn:hover, .nav-btn.active {
            color: var(--gold);
        }

        .nav-btn.active::after {
            width: 100%;
        }

        /* MAIN CONTENT */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
            min-height: 60vh;
        }

        .category-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            text-align: center;
            opacity: 0;
            animation: fadeInDown 0.6s ease forwards;
        }

        .category-note {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 3rem;
            font-size: 0.9rem;
            opacity: 0;
            animation: fadeInDown 0.6s ease 0.2s forwards;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        /* MENU CARDS (Wow Effect) */
        .menu-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            opacity: 0; /* Handled by JS animation */
            transform: translateY(30px);
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.05), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .menu-card:hover {
            transform: translateY(-10px);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .menu-card:hover::before {
            transform: translateX(100%);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
            padding-bottom: 0.8rem;
        }

        .item-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-light);
            width: 70%;
        }

        .item-price {
            font-weight: 600;
            color: var(--gold);
            font-size: 1.1rem;
            text-align: right;
        }

        .item-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* ANIMATIONS */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .category-nav { padding: 0 1rem; }
            main { padding: 2rem 1rem; }
            .menu-card { padding: 1.5rem; }
        }
    </style>
</head>

        menuData.forEach((cat, index) => {
            const btn = document.createElement('button');
            btn.className = `nav-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = cat.category;
            btn.onclick = () => renderCategory(index, btn);
            navContainer.appendChild(btn);
        });

        // Fonction pour afficher le contenu avec effet "Wow"
        function renderCategory(index, btnNode = null) {
            // Mise à jour de la classe active sur les boutons
            if (btnNode) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btnNode.classList.add('active');
                // Scroll automatique de la nav pour centrer le bouton sur mobile
                btnNode.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            const data = menuData[index];
            menuContainer.innerHTML = ''; // Réinitialisation de la zone d'affichage

            // Création du Titre
            const title = document.createElement('h2');
            title.className = 'category-title';
            title.innerText = data.category;
            menuContainer.appendChild(title);

            // Ajout de la note si existante
            if (data.note) {
                const note = document.createElement('p');
                note.className = 'category-note';
                note.innerText = data.note;
                menuContainer.appendChild(note);
            }

            // Création de la grille des plats
            const grid = document.createElement('div');
            grid.className = 'menu-grid';

            data.items.forEach((item, i) => {
                const card = document.createElement('div');
                card.className = 'menu-card';
                // Délai d'animation progressif pour un effet cascade
                card.style.animation = `fadeUp 0.6s ease ${0.1 * i}s forwards`;

                card.innerHTML = `
                    <div class="item-header">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">${item.price} FCFA</div>
                    </div>
                    <div class="item-desc">${item.desc}</div>
                `;
                grid.appendChild(card);
            });

            menuContainer.appendChild(grid);
        }

        // Afficher la première catégorie au chargement
        renderCategory(0, navContainer.firstChild);
