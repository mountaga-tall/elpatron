name: Deploy EL PATRÓN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax and PWA manifest
        run: |
          node --check app.js
          node --check enhancements.js
          node --check icons.js
          node --check menu-data.js
          node --check i18n.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"

      - name: Check required pages, images and removed features
        run: |
          test -f index.html
          test -f fr/index.html
          test -f en/index.html
          test -f fr/pages/reservation.html
          test -f en/pages/reservation.html
          test -f images/logo.webp
          test -f images/events-ceremony.svg
          test -f images/events-professional.svg
          test -f icons/icon-192.webp
          test -f icons/icon-512.webp
          test ! -d ar
          python3 - <<'PY'
          from pathlib import Path
          import re
          import json

          app = Path("app.js").read_text(encoding="utf-8")
          css = Path("styles.css").read_text(encoding="utf-8")
          i18n = Path("i18n.js").read_text(encoding="utf-8")
          enhancements = Path("enhancements.js").read_text(encoding="utf-8")

          assert '[dir="rtl"]' not in css
          assert "LANGUAGE PILL" not in css
          for token in (".ep-favorites", ".ep-fav-", ".ep-reviews-grid", ".ep-rating-card", ".is-favorite"):
              assert token not in css, f"Legacy CSS remains: {token}"
          for token in ("Arabic catalogue layer", "AR_NAME_PHRASES", "AR_DESC_PHRASES", "Object.assign(U.ar"):
              assert token not in i18n, f"Arabic translation code remains: {token}"
          for token in ("syncFav", "ep-favorites", "ep-fav-", "ep-reviews", "lang==='ar'"):
              assert token not in enhancements, f"Removed feature logic remains: {token}"
          for token in ("LANG==='ar'", "ar-EG", "ar:{"):
              assert token not in app, f"Arabic cart/navigation code remains: {token}"
          assert 'class="price-option"' in app and 'options.map(o=>`<span class="price-option">' in app, "All product price options must be shown"
          assert 'data-add="true"' in app and 'class="add-btn-label"' in app, "Add-to-cart button must be rendered on priced products"
          assert 'const option=options.slice().sort((a,b)=>Number(a.amount)-Number(b.amount))[0]' in app and 'window.openProductOptions(p,option,productCategory)' in app, "Customizable products must open the options chooser before being added"
          assert 'function buildSizeButtons(entries)' in app and "categorySlug==='pizzas'" in app and 'data-size-group' in app, "Pizza size chooser is missing"
          assert 'data-pizza-size-index' in app and "Number(selected.amount)===Math.min(...options.map(item=>Number(item.amount)))" in app, "Grand pizzas must add directly and Moyen pizzas must offer the size popup"
          assert 'isTacoUpgradeProduct' in app and "XL (+4 000 FCFA)" in app, "Only the six cheapest tacos must offer the XL upgrade"
          menu_source = Path("menu-data.js").read_text(encoding="utf-8")
          menu_match = re.search(r'window\.EL_PATRON_MENU=(\{[\s\S]*?\n\});', menu_source)
          assert menu_match, "Could not parse menu data for taco XL pricing"
          menu_data = json.loads(menu_match.group(1))
          by_id = {product["id"]: product for items in menu_data.values() if isinstance(items, list) for product in items}
          for n in range(1, 7):
              base = by_id[f"tacos-kebab-{n}"]["price"][0]["amount"]
              xl = by_id[f"tacos-kebab-{n+6}"]["price"][0]["amount"]
              assert xl == base + 4000, f"Taco tacos-kebab-{n+6} must cost exactly 4,000 FCFA more than its L version"
          assert '.product-card .product-prices' in css and '.product-card .product-foot .add-btn' in css, "Product prices and add-to-cart buttons must remain visible"
          assert 'class="icon-btn open-cart"' in app and 'class="cart-drawer"' in app, "Cart must be accessible from the header"
          assert not any(token in css + app + enhancements for token in (".ep-favorites", ".ep-fav-", "is-favorite", "ep-rating-card")), "Removed favourites or rating UI must not return"
          for token in ('bindProductButtons(host,all)', 'bindProductButtons(fgrid,featuredItems)'):
              assert token in app, f"Product rendering missing: {token}"
          assert '<select name="occasion" required>' in enhancements and "ep-reservation-choice-grid" not in css and "choiceIllustrations" not in enhancements, "Classic reservation selector must be restored"
          fr_reservation = Path("fr/pages/reservation.html").read_text(encoding="utf-8")
          en_reservation = Path("en/pages/reservation.html").read_text(encoding="utf-8")
          assert len(re.findall(r'class="reservation-event-card reservation-occasion-card"', fr_reservation)) == 10, "French reservation page must show ten illustrated occasions"
          assert len(re.findall(r'class="reservation-event-card reservation-occasion-card"', en_reservation)) == 10, "English reservation page must show ten illustrated occasions"
          assert "reservation-events-grid--ten" in css, "Ten-occasion grid styles missing"
          assert 'if(actions&&!actions.querySelector(".language-switcher"))actions.insertBefore(build("language-switcher"),actions.firstChild);' in i18n, "Header language switcher missing"
          assert 'if(mobileLinks)mobileLinks.querySelectorAll(".language-mobile").forEach(function(node){node.remove();});' in i18n, "Hamburger language switcher removal missing"
          assert 'return path+(location.search||"")+(location.hash||"");' in i18n, "Language switcher must preserve query and anchor"
          assert 'var path=inPages?"/"+locale+"/pages/"+file:"/"+locale+"/";' in i18n, "Language switcher must use stable locale paths"
          assert "escaped=String(pairs[i][0])" in i18n and '"giu"' in i18n, "Translations must match whole words safely"
          assert 'if(lang==="en"&&key==="name")q[key]=q[key].toLocaleUpperCase("en-US")' in i18n, "English product names must be uppercase"
          assert '"tiktok": "https://www.tiktok.com/@elpatronabidjan1"' in Path("menu-data.js").read_text(encoding="utf-8"), "Global TikTok URL must use @elpatronabidjan1"
          for contact_page in ("fr/pages/contact.html", "en/pages/contact.html"):
              contact_html = Path(contact_page).read_text(encoding="utf-8")
              assert 'https://www.tiktok.com/@elpatronabidjan1' in contact_html and '@elpatronabidjan1' in contact_html, f"TikTok contact link outdated: {contact_page}"
              assert '@elpatronci1' not in contact_html, f"Old TikTok handle remains: {contact_page}"
          assert "quickRecs" not in enhancements and "ep-recos" not in enhancements, "Cart recommendation injection must be removed"
          assert ".ep-recos" not in css and ".ep-reco" not in css, "Cart recommendation styles must be removed"
          assert 'img[alt]' in i18n and 'textarea[placeholder]' in i18n, "Accessible image labels and textarea placeholders must be localizable"
          fr_page_names = {p.name for p in Path("fr/pages").glob("*.html")}
          en_page_names = {p.name for p in Path("en/pages").glob("*.html")}
          assert fr_page_names == en_page_names, "French and English page sets must match"
          for locale in ("fr", "en"):
              locale_pages = [Path(locale + "/index.html"), *Path(locale + "/pages").glob("*.html")]
              for page in locale_pages:
                  html = page.read_text(encoding="utf-8")
                  assert re.search(r'<html[^>]*\blang="' + locale + r'"', html), f"Wrong or missing document language: {page}"
                  assert "i18n.js" in html, f"Language support script missing: {page}"
          assert "const host=$('.site-header .header-inner')" in enhancements, "Opening status must live in the header"
          assert ".ep-status{position:static" in css, "Opening status must not float over the hero"
          assert "body:has(.cart-drawer.open) .ep-mobile-bar" in css, "Mobile overlay click-safety missing"
          assert ".footer-menu-links" in css and "row-gap:3px!important" in css and ".footer-menu-links>a" in css, "Footer menu links must have compact, consistent spacing"
          for source in (app, css, i18n, enhancements):
              assert not any(0x0600 <= ord(char) <= 0x06FF for char in source), "Arabic-script content remains in site assets"

          for name in ('name="fullName"', 'name="phone"', 'name="message"', 'name="company"'):
              assert name in enhancements, f"Reservation field missing: {name}"

          for page in Path(".").rglob("*.html"):
              text = page.read_text(encoding="utf-8")
              assert 'dir="rtl"' not in text, f"RTL remains in {page}"
              assert 'lang="ar"' not in text, f"Arabic document remains in {page}"
              assert "/ar/" not in text, f"Arabic URL remains in {page}"
          print("Static cleanup checks passed.")
          PY

      - name: Refresh HTML asset URLs to prevent stale browser cache
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["ASSET_VERSION"][:12]
          asset = re.compile(r'(styles\.css|app\.js|enhancements\.js|i18n\.js|icons\.js|menu-data\.js)(?:\?v=[^"\\\'\\s>]+)?')
          for page in Path(".").rglob("*.html"):
              source = page.read_text(encoding="utf-8")
              updated = asset.sub(lambda m: m.group(1) + "?v=" + version, source)
              if updated != source:
                  page.write_text(updated, encoding="utf-8")
          print(f"Asset cache-buster set to {version}.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
